<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 300px;
      padding: 20px;
      background: #fafafa;
      color: #1a1a2e;
    }
    h2 {
      font-size: 1rem;
      margin-bottom: 16px;
      color: #4f46e5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      font-size: 0.82rem;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #444;
    }
    input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4f46e5; }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    #status {
      margin-top: 10px;
      font-size: 0.8rem;
      text-align: center;
      min-height: 18px;
    }
    .hint {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #888;
      line-height: 1.5;
    }
    .hint a { color: #4f46e5; }
  </style>
</head>
<body>
  <h2>🧮 Kwyk Assistant</h2>
  <label for="apiKey">Clé API Anthropic</label>
  <input type="password" id="apiKey" placeholder="sk-ant-api03-…" autocomplete="off" />
  <button id="save">Enregistrer</button>
  <div id="status"></div>
  <p class="hint">
    Obtiens ta clé sur <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>.<br>
    Elle est stockée localement dans ton navigateur.
  </p>
  <script src="popup.js"></script>
</body>
</html>
